[pytest]
# ── Test Discovery ─────────────────────────────────────────────────────────────
# Tell pytest where to find tests and what files count as test files.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output Formatting ─────────────────────────────────────────────────────────
# -v           : verbose — show each test name and PASSED/FAILED
# --tb=short   : short traceback on failure (not the full 50-line wall of text)
# --strict-markers : fail if a test uses an undefined @pytest.mark
addopts =
    -v
    --tb=short
    --strict-markers

# ── Custom Markers ─────────────────────────────────────────────────────────────
# Define markers here so --strict-markers doesn't complain.
# Use these to tag slow or integration tests:
#   @pytest.mark.slow         — marks tests that take > 1 second
#   @pytest.mark.integration  — marks tests that call the full pipeline
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks end-to-end integration tests
